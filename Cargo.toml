[package]
name = "upload_files_rust"
version = "1.0.0"
edition = "2021"
authors = ["anst-dev"]
description = "Fast, lightweight file upload and streaming server written in Rust"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "cors", "set-status"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
get_if_addrs = "0.5"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
chrono = "0.4"
dotenvy = "0.15"
futures-util = "0.3"
