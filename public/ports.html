<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Cổng (Ports) đang hoạt động</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #abd1c6;
      font-family: Arial, sans-serif;
      color: #fffffe;
    }
    .container {
      width: 95%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px;
      background-color: #004643;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .nav-container {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .nav-link {
      color: #fffffe;
      text-decoration: none;
      font-size: 22px;
      padding: 10px 18px;
      margin: 0 10px;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .nav-link:hover, .nav-link.active {
      background-color: #f9bc60;
      color: #004643;
      font-weight: bold;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    .title {
      font-size: 32px;
      margin: 0;
      color: #fffffe;
    }
    .btn-refresh {
      background-color: #f9bc60;
      color: #004643;
      border: none;
      padding: 12px 24px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-refresh:hover {
      opacity: 0.9;
    }
    .search-box {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .table-container {
      overflow-x: auto;
      background: #003330;
      border-radius: 10px;
      padding: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 14px 16px;
      border-bottom: 1px solid #0f4c47;
    }
    th {
      background-color: #002624;
      color: #f9bc60;
      font-size: 18px;
      position: sticky;
      top: 0;
    }
    tr:hover {
      background-color: rgba(255, 255, 255, 0.05);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    .badge-tcp {
      background-color: #2a9d8f;
      color: #fff;
    }
    .badge-udp {
      background-color: #e76f51;
      color: #fff;
    }
    .port-number {
      font-size: 18px;
      font-weight: bold;
      color: #f9bc60;
    }
    .status-msg {
      text-align: center;
      padding: 30px;
      font-size: 20px;
      color: #abd1c6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-container">
      <a href="/" class="nav-link">Trang chủ</a>
      <a href="/gallery.html" class="nav-link">Thư viện</a>
      <a href="/ports.html" class="nav-link active">Danh sách Port</a>
    </div>

    <div class="header-bar">
      <h1 class="title">Danh Sách Cổng Đang Hoạt Động (Listening Ports)</h1>
      <button class="btn-refresh" onclick="loadPorts()">Làm mới</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="Tìm kiếm theo Port, Tiến trình, Địa chỉ..." oninput="filterPorts()">

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Giao thức</th>
            <th>Port</th>
            <th>Địa chỉ Local</th>
            <th>Trạng thái</th>
            <th>PID</th>
            <th>Tiến trình (Process)</th>
          </tr>
        </thead>
        <tbody id="portsTableBody">
          <tr>
            <td colspan="6" class="status-msg">Đang tải danh sách port...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let allPorts = [];

    function loadPorts() {
      const tbody = document.getElementById('portsTableBody');
      tbody.innerHTML = '<tr><td colspan="6" class="status-msg">Đang tải danh sách port...</td></tr>';

      fetch('/api/listening-ports')
        .then(res => res.json())
        .then(res => {
          if (res.success && res.data) {
            allPorts = res.data;
            renderPorts(allPorts);
          } else {
            tbody.innerHTML = '<tr><td colspan="6" class="status-msg" style="color: #e16162;">Không thể lấy danh sách port!</td></tr>';
          }
        })
        .catch(err => {
          console.error(err);
          tbody.innerHTML = '<tr><td colspan="6" class="status-msg" style="color: #e16162;">Lỗi kết nối API!</td></tr>';
        });
    }

    function renderPorts(ports) {
      const tbody = document.getElementById('portsTableBody');
      if (ports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="status-msg">Không tìm thấy port nào phù hợp.</td></tr>';
        return;
      }

      tbody.innerHTML = ports.map(item => `
        <tr>
          <td><span class="badge ${item.protocol === 'UDP' ? 'badge-udp' : 'badge-tcp'}">${item.protocol}</span></td>
          <td class="port-number">${item.port || '-'}</td>
          <td>${item.localAddress || '-'}</td>
          <td><span style="color: #57cb99; font-weight: bold;">${item.state || 'LISTEN'}</span></td>
          <td>${item.pid || '-'}</td>
          <td><strong>${item.process || '-'}</strong></td>
        </tr>
      `).join('');
    }

    function filterPorts() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderPorts(allPorts);
        return;
      }
      const filtered = allPorts.filter(item => 
        (item.port && item.port.toString().includes(query)) ||
        (item.localAddress && item.localAddress.toLowerCase().includes(query)) ||
        (item.process && item.process.toLowerCase().includes(query)) ||
        (item.pid && item.pid.toString().includes(query)) ||
        (item.protocol && item.protocol.toLowerCase().includes(query))
      );
      renderPorts(filtered);
    }

    // Tự động tải khi mở trang
    loadPorts();
  </script>
</body>
</html>
