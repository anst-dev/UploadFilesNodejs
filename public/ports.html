<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh sách Địa chỉ & Cổng kết nối</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #abd1c6;
      font-family: Arial, sans-serif;
      color: #fffffe;
    }
    .container {
      width: 95%;
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
      background-color: #004643;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }
    .nav-container {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .nav-link {
      color: #fffffe;
      text-decoration: none;
      font-size: 22px;
      padding: 10px 18px;
      margin: 0 10px;
      border-radius: 8px;
      transition: background-color 0.3s;
    }
    .nav-link:hover, .nav-link.active {
      background-color: #f9bc60;
      color: #004643;
      font-weight: bold;
    }
    .title {
      font-size: 32px;
      margin: 0 0 10px 0;
      color: #fffffe;
      text-align: center;
    }
    .subtitle {
      font-size: 18px;
      color: #abd1c6;
      text-align: center;
      margin-bottom: 25px;
    }
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .url-card {
      background: #003330;
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s, background-color 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .url-card:hover {
      background: #044b46;
      transform: translateY(-2px);
    }
    .info-left {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .iface-tag {
      display: inline-block;
      font-size: 14px;
      color: #abd1c6;
      background: rgba(0, 0, 0, 0.25);
      padding: 3px 8px;
      border-radius: 4px;
      width: fit-content;
    }
    .url-text {
      font-size: 20px;
      font-weight: bold;
      color: #fffffe;
    }
    .btn-open {
      background-color: #f9bc60;
      color: #004643;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: opacity 0.2s;
    }
    .btn-open:hover {
      opacity: 0.9;
    }
    .status-msg {
      text-align: center;
      padding: 30px;
      font-size: 20px;
      color: #abd1c6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-container">
      <a href="/" class="nav-link">Trang chủ</a>
      <a href="/gallery.html" class="nav-link">Thư viện</a>
      <a href="/ports.html" class="nav-link active">Danh sách Port</a>
    </div>

    <h1 class="title">Danh Sách Địa Chỉ Cổng Kết Nối</h1>
    <p class="subtitle">Bấm vào bất kỳ địa chỉ bên dưới để mở trong một thẻ (tab) mới</p>

    <div class="card-list" id="urlsContainer">
      <div class="status-msg">Đang tải danh sách địa chỉ server...</div>
    </div>
  </div>

  <script>
    fetch('/api/server-addresses')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('urlsContainer');
        if (data.addresses && data.addresses.length > 0) {
          container.innerHTML = data.addresses.map(item => `
            <div class="url-card">
              <div class="info-left">
                <span class="iface-tag">Card mạng: ${item.interface}</span>
                <span class="url-text">${item.url}</span>
              </div>
              <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-open">
                Mở tab mới ↗
              </a>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<div class="status-msg">Không tìm thấy địa chỉ nào!</div>';
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('urlsContainer').innerHTML = '<div class="status-msg" style="color: #e16162;">Lỗi khi tải danh sách!</div>';
      });
  </script>
</body>
</html>
