<html>

<head>
  <script src='js/video_upload.js?v=3'></script>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #abd1c6;
      font-family: Arial, sans-serif;
      font-size: 18px; /* Increased base font size */
    }
    .container {
      width: 95%; /* Increased from 90% to 95% */
      max-width: 800px; /* Increased from 600px to 800px for larger display */
      padding: 30px; /* Increased padding */
      background-color: #004643;
      border-radius: 15px; /* Slightly increased border radius */
    }
    .nav-link {
      color: #fffffe;
      text-decoration: none;
      font-size: 28px; /* Increased from 24px */
      margin-right: 25px; /* Slightly increased margin */
    }
    .title {
      font-size: 42px; /* Increased from 36px */
      color: #fffffe;
      text-align: center;
      margin-bottom: 30px; /* Increased margin */
    }
    .qr-container {
      display: flex;
      justify-content: center;
      margin-top: 30px; /* Increased margin */
    }
    #qr-image {
      width: 250px; /* Increased from 200px */
      height: 250px; /* Increased from 200px */
    }
    .form-group {
      margin-bottom: 30px; /* Increased margin */
    }
    .custom-label {
      display: block;
      color: #fffffe;
      font-size: 22px; /* Increased from 18px */
      margin-bottom: 15px; /* Increased margin */
    }
    .file-input {
      width: 100%;
      padding: 15px; /* Increased padding */
      font-size: 18px; /* Increased from 16px */
      background-color: #fffffe;
      border: none;
      border-radius: 8px; /* Slightly increased border radius */
    }
    .submit-button {
      width: 100%;
      padding: 20px; /* Increased padding */
      font-size: 22px; /* Increased from 18px */
      background-color: #f9bc60;
      color: #004643;
      border: none;
      border-radius: 8px; /* Slightly increased border radius */
      cursor: pointer;
    }
    #message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 18px;
      text-align: center;
    }
    .success {
      background-color: #2ecc71;
      color: #fffffe;
      font-weight: bold;
      font-size: 20px;
    }
    .error {
      background-color: #e16162;
      color: #fffffe;
    }
    #preview-container {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .preview-item {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <nav>
        <a href='/' class="nav-link">Trang chủ</a>
        <a href='/gallery.html' class="nav-link">Thư viện</a>
        <a href='/ports.html' class="nav-link">Danh sách Port</a>
      </nav>
    </header>
    
    <h1 class="title">Tải lên video hoặc hình ảnh</h1>
    
    <div>
      <p style="color: #fffffe; font-size: 22px; margin-bottom: 8px;">Nhập trên điện thoại, thiết bị: <span id="ip-address"></span></p>
      
      <div id="address-box-wrapper" style="background: rgba(0,0,0,0.25); border-radius: 10px; padding: 12px 15px; margin-bottom: 15px; color: #fffffe; border: 1px solid rgba(255,255,255,0.15); transition: all 0.3s ease;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px;">
          <div style="font-size: 18px; color: #f9bc60; font-weight: bold;">
            📋 Danh sách IP / URL của máy (bấm vào để mở tab mới):
          </div>
          <div style="display: flex; gap: 8px; align-items: center;">
            <button type="button" id="btn-zoom-in" onclick="changeAddressZoom(1)" style="background: #004643; color: #fffffe; border: 1px solid #f9bc60; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; font-weight: bold;" title="Phóng to danh sách link">🔍 Phóng to +</button>
            <button type="button" id="btn-zoom-out" onclick="changeAddressZoom(-1)" style="background: #004643; color: #fffffe; border: 1px solid #f9bc60; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 14px; font-weight: bold;" title="Thu nhỏ danh sách link">Thu nhỏ -</button>
            <button type="button" id="btn-toggle-address" onclick="toggleAddressList()" style="background: #f9bc60; color: #004643; border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 14px; font-weight: bold;" title="Ẩn hoặc hiện danh sách link">👁️ Ẩn bớt</button>
          </div>
        </div>
        <div id="address-list" style="transition: font-size 0.2s ease, max-height 0.3s ease; overflow-y: auto; max-height: 400px;">Đang tải danh sách...</div>
      </div>
    </div>

    <div class="qr-container">
      <img src="" id="qr-image" alt="QR Code">
    </div>
    
    <form enctype="multipart/form-data" name='videoUpload' id='video-upload'>
      <div class='form-group'>
        <label class='custom-label'>Chọn file để tải lên:</label>
        <input multiple class="file-input" accept="video/mp4, video/quicktime, image/*" type="file" name="user-file" id="file-input">
      </div>
      <div id="preview-container"></div>
      <div>
        <input class="submit-button" type="submit" id='submit' value="Tải lên"  onclick='onSubmit(event)' name="submit">
      </div>
    </form>

    <div id='message'></div>
    <div id="progress-container" style="
      width: 100%;
      height: 40px;
      background-color: #0f3b38;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 15px;
      position: relative;
      display: none;
    ">
      <div id="progress-bar" style="
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #f9bc60, #f59e0b);
        border-radius: 20px;
        transition: width 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
      "></div>
      <span id="progress-text" style="
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fffffe;
        font-size: 18px;
        font-weight: bold;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
      ">0%</span>
    </div>
  </div>

  <script>
    function previewFiles() {
      const preview = document.getElementById('preview-container');
      const files = document.getElementById('file-input').files;

      preview.innerHTML = '';

      function readAndPreview(file) {
        if (/\.(jpe?g|png|gif)$/i.test(file.name)) {
          const reader = new FileReader();

          reader.addEventListener("load", function () {
            const image = new Image();
            image.height = 150;
            image.title = file.name;
            image.src = this.result;
            image.className = 'preview-item';
            preview.appendChild(image);
          }, false);

          reader.readAsDataURL(file);
        } else if (/\.(mp4|mov|avi|webm)$/i.test(file.name)) {
          const video = document.createElement('video');
          video.width = 150;
          video.height = 150;
          video.title = file.name;
          video.src = URL.createObjectURL(file);
          video.className = 'preview-item';
          video.controls = true;
          preview.appendChild(video);
        }
      }

      if (files) {
        Array.from(files).forEach(readAndPreview);
      }
    }

    document.getElementById('file-input').addEventListener('change', previewFiles);
  </script>
</body>

</html>
